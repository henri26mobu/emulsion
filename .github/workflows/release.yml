name: Release

# À chaque push sur main (hors .md) : compile l'APK et publie une release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleRelease --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VER.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "emulsion-$TAG.apk"
          gh release create "$TAG" "emulsion-$TAG.apk" --target "${{ github.sha }}" --title "Émulsion $TAG" --generate-notes
