server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # caméra autorisée pour cette origine uniquement ; aucune autre API sensible
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; worker-src 'self'; manifest-src 'self'" always;

  # fichiers hachés par Vite : cache longue durée
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Permissions-Policy "camera=()" always;
  }

  # le service worker et le manifeste doivent se mettre à jour vite
  location ~ ^/(sw\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; worker-src 'self'; manifest-src 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
